<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>FPV RC Tank</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      touch-action: none;
      background: #0a0a0a;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    #app {
      position: fixed;
      top: env(safe-area-inset-top, 0px);
      left: env(safe-area-inset-left, 0px);
      right: env(safe-area-inset-right, 0px);
      bottom: env(safe-area-inset-bottom, 0px);
      display: grid;
      grid-template-columns: clamp(60px, 17vw, 105px) 1fr clamp(60px, 17vw, 105px);
      gap: clamp(4px, 1.2vw, 10px);
      padding: clamp(4px, 1.2vw, 10px);
      background: #0a0a0a;
      color: #fff;
      overflow: hidden;
    }

    .side {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 6px 0;
      gap: 4px;
      min-height: 0;
      overflow: hidden;
    }

    .track-label {
      font-size: clamp(9px, 1.2vw, 11px);
      color: #3a3a3a;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      flex-shrink: 0;
    }

    .pct-display {
      font-size: clamp(10px, 1.5vw, 13px);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: #333;
      flex-shrink: 0;
      min-width: 44px;
      text-align: center;
      transition: color 0.1s;
    }

    .pct-display.fwd {
      color: #1D9E75;
    }

    .pct-display.bwd {
      color: #e24b4a;
    }

    .vslider-track {
      flex: 1;
      min-height: 0;
      width: clamp(44px, 12vw, 72px);
      background: #111;
      border: 1px solid #1e1e1e;
      border-radius: 999px;
      position: relative;
      touch-action: none;
      cursor: pointer;
      overflow: hidden;
    }

    .vslider-track::before {
      content: '';
      position: absolute;
      left: 22%;
      right: 22%;
      top: 50%;
      height: 1px;
      background: #252525;
      pointer-events: none;
    }

    .vslider-fill {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 38%;
      border-radius: 999px;
      pointer-events: none;
      height: 0;
      top: 50%;
    }

    .vslider-thumb {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: clamp(34px, 9vw, 54px);
      height: clamp(34px, 9vw, 54px);
      background: #1c1c1c;
      border: 1.5px solid #2a2a2a;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      transition: border-color 0.08s, background 0.08s, box-shadow 0.08s;
      z-index: 2;
    }

    .vslider-thumb svg {
      width: 38%;
      height: 38%;
      stroke: #333;
      fill: none;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.08s;
    }

    .vslider-track.fwd .vslider-fill {
      background: linear-gradient(to top, #1D9E75, #0a4a30);
    }

    .vslider-track.bwd .vslider-fill {
      background: linear-gradient(to bottom, #e24b4a, #7a1a1a);
    }

    .vslider-track.fwd .vslider-thumb {
      border-color: #1D9E75;
      background: #071a10;
      box-shadow: 0 0 0 3px rgba(29, 158, 117, 0.15), 0 0 16px rgba(29, 158, 117, 0.2);
    }

    .vslider-track.fwd .vslider-thumb svg {
      stroke: #1D9E75;
    }

    .vslider-track.bwd .vslider-thumb {
      border-color: #e24b4a;
      background: #1a0808;
      box-shadow: 0 0 0 3px rgba(226, 75, 74, 0.15), 0 0 16px rgba(226, 75, 74, 0.2);
    }

    .vslider-track.bwd .vslider-thumb svg {
      stroke: #e24b4a;
    }

    #center {
      display: grid;
      grid-template-rows: 1fr clamp(26px, 4.5vh, 36px) clamp(26px, 4.5vh, 36px);
      gap: clamp(3px, 0.8vh, 6px);
      min-height: 0;
      overflow: hidden;
    }

    #cam-feed {
      min-height: 0;
      background: #0f0f0f;
      border-radius: clamp(5px, 1.2vw, 10px);
      border: 0.5px solid #1e1e1e;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    #cam-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    #cam-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    #cam-placeholder svg {
      width: clamp(20px, 4vw, 30px);
      height: clamp(20px, 4vw, 30px);
      stroke: #2a2a2a;
      fill: none;
    }

    #cam-placeholder span {
      font-size: clamp(9px, 1.3vw, 12px);
      color: #2a2a2a;
    }

    #cam-loading {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .spinner {
      width: 22px;
      height: 22px;
      border: 2px solid #2a2a2a;
      border-top-color: #7F77DD;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    #cam-loading span {
      font-size: clamp(9px, 1.3vw, 11px);
      color: #555;
    }

    #hud {
      position: absolute;
      top: 6px;
      left: 6px;
      right: 6px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
    }

    #ws-status {
      font-size: clamp(8px, 1vw, 10px);
      padding: 2px 6px;
      border-radius: 20px;
      font-weight: 500;
      opacity: 0.75;
    }

    .ws-off {
      background: #1a0808;
      color: #c04040;
      border: 0.5px solid #4a1a1a;
    }

    .ws-on {
      background: #081a10;
      color: #159060;
      border: 0.5px solid #0a4a28;
    }

    #ping-badge {
      font-size: clamp(8px, 1vw, 10px);
      padding: 2px 6px;
      border-radius: 20px;
      background: #0e0e1c;
      color: #5550aa;
      border: 0.5px solid #252270;
      font-variant-numeric: tabular-nums;
      opacity: 0.75;
    }

    .bar {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
      overflow: hidden;
      height: 100%;
    }

    .bar-label {
      font-size: 12px;
      flex-shrink: 0;
    }

    input.ip {
      flex: 1;
      min-width: 0;
      height: 100%;
      background: #111;
      border: 0.5px solid #2a2a2a;
      border-radius: 6px;
      color: #aaa;
      font-size: clamp(9px, 1.3vw, 12px);
      padding: 0 7px;
      outline: none;
    }

    input.ip:focus {
      border-color: #444;
    }

    input.port {
      width: clamp(32px, 6vw, 46px);
      height: 100%;
      flex-shrink: 0;
      background: #111;
      border: 0.5px solid #2a2a2a;
      border-radius: 6px;
      color: #aaa;
      font-size: clamp(9px, 1.3vw, 12px);
      padding: 0 5px;
      text-align: center;
      outline: none;
    }

    .bar-btn {
      height: 100%;
      padding: 0 9px;
      border-radius: 6px;
      border: 0.5px solid #2a2a2a;
      background: #161616;
      color: #888;
      font-size: clamp(9px, 1.2vw, 12px);
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: background .1s, color .1s, border-color .1s;
    }

    .bar-btn.ws-on {
      border-color: #0d5e3a;
      color: #1D9E75;
      background: #081a10;
    }

    .bar-btn.cam-active {
      border-color: #7F77DD;
      color: #7F77DD;
      background: #0e0e1c;
    }

    .cam-badge {
      height: 100%;
      display: flex;
      align-items: center;
      padding: 0 7px;
      border-radius: 6px;
      font-size: clamp(9px, 1.2vw, 11px);
      font-weight: 500;
      white-space: nowrap;
      flex-shrink: 0;
      transition: color .1s, border-color .1s, background .1s;
    }

    .cam-badge.off {
      background: #111;
      color: #444;
      border: 0.5px solid #2a2a2a;
    }

    .cam-badge.noconn {
      background: #1a0e08;
      color: #c07040;
      border: 0.5px solid #5a3010;
    }

    .cam-badge.live {
      background: #081a10;
      color: #1D9E75;
      border: 0.5px solid #0d5e3a;
    }

    .cam-badge.loading {
      background: #0e0e1c;
      color: #7F77DD;
      border: 0.5px solid #322d7a;
    }

    /* ── LED FAB ── */
    #led-fab {
      position: fixed;
      bottom: calc(env(safe-area-inset-bottom, 0px) + clamp(44px, 9vh, 68px));
      left: 50%;
      transform: translateX(-50%);
      width: 46px;
      height: 46px;
      background: #161616;
      border: 1px solid #2a2a2a;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 100;
      transition: background 0.12s, border-color 0.12s, box-shadow 0.12s;
      touch-action: manipulation;
    }

    #led-fab.open {
      background: #12121e;
      border-color: #7F77DD;
      box-shadow: 0 0 0 3px rgba(127, 119, 221, 0.12), 0 0 18px rgba(127, 119, 221, 0.18);
    }

    #led-fab svg {
      width: 18px;
      height: 18px;
      transition: opacity 0.12s;
    }

    #led-fab .icon-grid {
      fill: #3a3a3a;
      display: block;
    }

    #led-fab .icon-close {
      fill: #7F77DD;
      display: none;
    }

    #led-fab.open .icon-grid {
      display: none;
    }

    #led-fab.open .icon-close {
      display: block;
    }

    /* ── LED Popup ── */
    #led-popup {
      position: fixed;
      bottom: calc(env(safe-area-inset-bottom, 0px) + clamp(102px, 19vh, 128px));
      left: 50%;
      transform: translateX(-50%);
      z-index: 101;
      display: none;
    }

    #led-popup.show {
      display: block;
      animation: popUp 0.15s ease-out;
    }

    @keyframes popUp {
      from {
        opacity: 0;
        transform: translateX(-50%) translateY(8px) scale(0.97);
      }

      to {
        opacity: 1;
        transform: translateX(-50%) translateY(0) scale(1);
      }
    }

    #led-panel {
      background: #111;
      border: 1px solid #222;
      border-radius: 14px;
      padding: 12px 16px;
      min-width: 180px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.7);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .led-panel-title {
      font-size: 9px;
      font-weight: 700;
      color: #333;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      text-align: center;
      padding-bottom: 8px;
      border-bottom: 1px solid #1e1e1e;
    }

    .led-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .led-label {
      font-size: 12px;
      font-weight: 600;
      color: #444;
      transition: color 0.2s;
      user-select: none;
    }

    .led-row.on .led-label {
      color: #c8b84a;
    }

    /* Toggle */
    .toggle {
      position: relative;
      width: 40px;
      height: 22px;
      flex-shrink: 0;
      cursor: pointer;
    }

    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
      position: absolute;
    }

    .toggle-track {
      position: absolute;
      inset: 0;
      background: #1a1a1a;
      border: 1px solid #282828;
      border-radius: 999px;
      transition: background 0.2s, border-color 0.2s;
    }

    .toggle-thumb {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 14px;
      height: 14px;
      background: #333;
      border-radius: 50%;
      transition: left 0.18s cubic-bezier(.4, 0, .2, 1), background 0.2s;
    }

    .toggle input:checked~.toggle-track {
      background: #211e00;
      border-color: #c8b84a;
    }

    .toggle input:checked~.toggle-thumb {
      left: 21px;
      background: #c8b84a;
      box-shadow: 0 0 6px rgba(200, 184, 74, 0.45);
    }

    /* dim backdrop to close popup */
    #led-backdrop {
      position: fixed;
      inset: 0;
      z-index: 99;
      display: none;
    }

    #led-backdrop.show {
      display: block;
    }
  </style>
</head>

<body>
  <div id="app">

    <div class="side">
      <span class="track-label">L</span>
      <span class="pct-display" id="pct-left">0%</span>
      <div class="vslider-track" id="slider-left">
        <div class="vslider-fill" id="fill-left"></div>
        <div class="vslider-thumb" id="thumb-left">
          <svg viewBox="0 0 24 24">
            <line x1="12" y1="5" x2="12" y2="19" />
            <polyline points="8 9 12 5 16 9" />
            <polyline points="8 15 12 19 16 15" />
          </svg>
        </div>
      </div>
    </div>

    <div id="center">
      <div id="cam-feed">
        <img id="cam-img" alt="live stream">
        <div id="cam-placeholder">
          <svg viewBox="0 0 24 24">
            <rect x="2" y="6" width="20" height="14" rx="2" />
            <circle cx="12" cy="13" r="3" />
            <path d="M7 6V4h4v2" />
          </svg>
          <span>Kamera offline</span>
        </div>
        <div id="cam-loading">
          <div class="spinner"></div><span>Connecting...</span>
        </div>
        <div id="hud">
          <span id="ws-status" class="ws-off">WS: Off</span>
          <span id="ping-badge">--ms</span>
        </div>
      </div>
      <div class="bar">
        <span class="bar-label">📷</span>
        <input class="ip" type="text" id="cam-ip" value="192.168.4.2" placeholder="IP Kamera">
        <input class="port" type="text" id="cam-port" value="81" placeholder="Port">
        <button class="bar-btn" id="cam-btn" onclick="toggleCam()">Stream</button>
        <span class="cam-badge off" id="cam-badge">Off</span>
      </div>
      <div class="bar">
        <span class="bar-label">🎮</span>
        <input class="ip" type="text" id="ws-ip" value="192.168.4.1" placeholder="IP ESP32">
        <button class="bar-btn" id="connect-btn" onclick="toggleConnect()">Connect</button>
      </div>
    </div>

    <div class="side">
      <span class="track-label">R</span>
      <span class="pct-display" id="pct-right">0%</span>
      <div class="vslider-track" id="slider-right">
        <div class="vslider-fill" id="fill-right"></div>
        <div class="vslider-thumb" id="thumb-right">
          <svg viewBox="0 0 24 24">
            <line x1="12" y1="5" x2="12" y2="19" />
            <polyline points="8 9 12 5 16 9" />
            <polyline points="8 15 12 19 16 15" />
          </svg>
        </div>
      </div>
    </div>

  </div>

  <!-- LED FAB Button -->
  <button id="led-fab" onclick="toggleLedPanel()">
    <!-- grid icon -->
    <svg class="icon-grid" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
      <rect x="1" y="1" width="6" height="6" rx="1.5" />
      <rect x="11" y="1" width="6" height="6" rx="1.5" />
      <rect x="1" y="11" width="6" height="6" rx="1.5" />
      <rect x="11" y="11" width="6" height="6" rx="1.5" />
    </svg>
    <!-- close icon -->
    <svg class="icon-close" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
      <line x1="3" y1="3" x2="15" y2="15" stroke="#7F77DD" stroke-width="2" stroke-linecap="round" />
      <line x1="15" y1="3" x2="3" y2="15" stroke="#7F77DD" stroke-width="2" stroke-linecap="round" />
    </svg>
  </button>

  <!-- Backdrop -->
  <div id="led-backdrop" onclick="closeLedPanel()"></div>

  <!-- LED Popup -->
  <div id="led-popup">
    <div id="led-panel">
      <div class="led-panel-title">LED Control</div>

      <div class="led-row" id="row-led1">
        <span class="led-label">LED 1</span>
        <label class="toggle">
          <input type="checkbox" id="sw-led1" onchange="onLedChange(1, this.checked)">
          <div class="toggle-track"></div>
          <div class="toggle-thumb"></div>
        </label>
      </div>

      <div class="led-row" id="row-led2">
        <span class="led-label">LED 2</span>
        <label class="toggle">
          <input type="checkbox" id="sw-led2" onchange="onLedChange(2, this.checked)">
          <div class="toggle-track"></div>
          <div class="toggle-thumb"></div>
        </label>
      </div>

      <div class="led-row" id="row-led3">
        <span class="led-label">LED 3</span>
        <label class="toggle">
          <input type="checkbox" id="sw-led3" onchange="onLedChange(3, this.checked)">
          <div class="toggle-track"></div>
          <div class="toggle-thumb"></div>
        </label>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('touchmove', e => {
      if (!e.target.closest('#led-panel')) e.preventDefault();
    }, { passive: false });
    document.addEventListener('touchstart', e => {
      if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'BUTTON' && !e.target.closest('label')) e.preventDefault();
    }, { passive: false });
    document.addEventListener('gesturestart', e => e.preventDefault());

    // ── Camera ──
    let camActive = false;
    function toggleCam() { camActive ? stopCam() : startCam(); }
    function startCam() {
      const ip = document.getElementById('cam-ip').value.trim();
      const port = document.getElementById('cam-port').value.trim();
      document.getElementById('cam-placeholder').style.display = 'none';
      document.getElementById('cam-loading').style.display = 'flex';
      setCamBadge('loading', 'Connecting...');
      const img = document.getElementById('cam-img');
      img.onload = () => {
        camActive = true;
        document.getElementById('cam-loading').style.display = 'none';
        img.style.display = 'block';
        document.getElementById('cam-btn').textContent = 'Stop';
        document.getElementById('cam-btn').className = 'bar-btn cam-active';
        setCamBadge('live', 'Live');
      };
      img.onerror = () => {
        document.getElementById('cam-loading').style.display = 'none';
        document.getElementById('cam-placeholder').style.display = 'flex';
        document.getElementById('cam-btn').textContent = 'Stream';
        document.getElementById('cam-btn').className = 'bar-btn';
        setCamBadge('noconn', 'No Conn');
      };
      img.src = 'http://' + ip + ':' + port + '/stream';
    }
    function stopCam() {
      camActive = false;
      const img = document.getElementById('cam-img');
      img.src = ''; img.style.display = 'none';
      document.getElementById('cam-placeholder').style.display = 'flex';
      document.getElementById('cam-btn').textContent = 'Stream';
      document.getElementById('cam-btn').className = 'bar-btn';
      setCamBadge('off', 'Off');
    }
    function setCamBadge(cls, txt) {
      const b = document.getElementById('cam-badge');
      b.className = 'cam-badge ' + cls; b.textContent = txt;
    }

    // ── LED Panel ──
    let ledPanelOpen = false;
    function toggleLedPanel() { ledPanelOpen ? closeLedPanel() : openLedPanel(); }
    function openLedPanel() {
      ledPanelOpen = true;
      document.getElementById('led-fab').classList.add('open');
      document.getElementById('led-popup').classList.add('show');
      document.getElementById('led-backdrop').classList.add('show');
    }
    function closeLedPanel() {
      ledPanelOpen = false;
      document.getElementById('led-fab').classList.remove('open');
      document.getElementById('led-popup').classList.remove('show');
      document.getElementById('led-backdrop').classList.remove('show');
    }
    function onLedChange(num, state) {
      // update row highlight
      document.getElementById('row-led' + num).className = 'led-row' + (state ? ' on' : '');
      // send via WebSocket
      if (connected && ws && ws.readyState === 1) {
        ws.send(JSON.stringify({ led: num, state: state ? 1 : 0 }));
      }
    }

    // ── Slider ──
    const SNAP = 8;
    const sliderVal = { left: 0, right: 0 };

    function setupSlider(side) {
      const track = document.getElementById('slider-' + side);
      const fill = document.getElementById('fill-' + side);
      const thumb = document.getElementById('thumb-' + side);
      const pctEl = document.getElementById('pct-' + side);
      let activeTouchId = null;

      function valFromY(clientY) {
        const rect = track.getBoundingClientRect();
        const topPx = rect.top + rect.height * 0.10;
        const botPx = rect.top + rect.height * 0.90;
        const clY = Math.max(topPx, Math.min(botPx, clientY));
        const rel = (clY - topPx) / (botPx - topPx);
        return Math.round((0.5 - rel) * 200);
      }

      function apply(rawVal) {
        const val = Math.abs(rawVal) < SNAP ? 0 : Math.max(-100, Math.min(100, rawVal));
        sliderVal[side] = val;
        const topPct = 50 - val * 0.4;
        thumb.style.top = topPct + '%';
        if (val > 0) {
          fill.style.top = topPct + '%'; fill.style.height = (50 - topPct) + '%';
        } else if (val < 0) {
          fill.style.top = '50%'; fill.style.height = (topPct - 50) + '%';
        } else {
          fill.style.height = '0%'; fill.style.top = '50%';
        }
        const dir = val > 0 ? 'fwd' : val < 0 ? 'bwd' : '';
        track.className = 'vslider-track' + (dir ? ' ' + dir : '');
        pctEl.className = 'pct-display' + (dir ? ' ' + dir : '');
        pctEl.textContent = val === 0 ? '0%' : (val > 0 ? '+' : '') + val + '%';
        sendDrive();
      }

      function release() { activeTouchId = null; apply(0); }

      track.addEventListener('mousedown', e => { activeTouchId = 'mouse'; apply(valFromY(e.clientY)); });
      document.addEventListener('mousemove', e => { if (activeTouchId === 'mouse') apply(valFromY(e.clientY)); });
      document.addEventListener('mouseup', () => { if (activeTouchId === 'mouse') release(); });

      track.addEventListener('touchstart', e => {
        e.preventDefault();
        if (activeTouchId !== null) return;
        const t = e.changedTouches[0];
        activeTouchId = t.identifier; apply(valFromY(t.clientY));
      }, { passive: false });
      document.addEventListener('touchmove', e => {
        if (activeTouchId === null || activeTouchId === 'mouse') return;
        for (const t of e.changedTouches) { if (t.identifier === activeTouchId) { apply(valFromY(t.clientY)); break; } }
      }, { passive: false });
      document.addEventListener('touchend', e => {
        for (const t of e.changedTouches) { if (t.identifier === activeTouchId) { release(); break; } }
      });
      document.addEventListener('touchcancel', e => {
        for (const t of e.changedTouches) { if (t.identifier === activeTouchId) { release(); break; } }
      });

      requestAnimationFrame(() => apply(0));
    }

    setupSlider('left');
    setupSlider('right');

    // ── WebSocket ──
    let ws = null, connected = false, pingTimer = null, pingStart = 0;
    let lastL = null, lastR = null;

    function sendDrive() {
      const l = sliderVal.left, r = sliderVal.right;
      if (l === lastL && r === lastR) return;
      lastL = l; lastR = r;
      if (connected && ws && ws.readyState === 1) ws.send(JSON.stringify({ left: l, right: r }));
    }

    function toggleConnect() {
      if (connected) { ws.close(); return; }
      const ip = document.getElementById('ws-ip').value.trim();
      try { ws = new WebSocket('ws://' + ip + '/ws'); } catch (e) { return; }
      ws.onopen = () => {
        connected = true;
        document.getElementById('ws-status').textContent = 'WS: On';
        document.getElementById('ws-status').className = 'ws-on';
        document.getElementById('connect-btn').textContent = 'Putus';
        document.getElementById('connect-btn').className = 'bar-btn ws-on';
        pingTimer = setInterval(() => {
          if (ws.readyState === 1) { pingStart = Date.now(); ws.send(JSON.stringify({ cmd: 'PING' })); }
        }, 2000);
      };
      ws.onmessage = e => {
        try { const d = JSON.parse(e.data); if (d.type === 'PONG') document.getElementById('ping-badge').textContent = (Date.now() - pingStart) + 'ms'; } catch (_) { }
      };
      ws.onclose = () => {
        connected = false; clearInterval(pingTimer);
        document.getElementById('ws-status').textContent = 'WS: Off';
        document.getElementById('ws-status').className = 'ws-off';
        document.getElementById('connect-btn').textContent = 'Connect';
        document.getElementById('connect-btn').className = 'bar-btn';
        document.getElementById('ping-badge').textContent = '--ms';
      };
    }
  </script>
</body>

</html>
